name: Build

# Every push and pull request: test, build, self-test, and upload the installer
# and screenshots of every Settings page as artifacts.
# Pushing a tag like v1.2.0: also publish a GitHub Release with the .pkg and .zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases

jobs:
  build:
    runs-on: macos-latest
    env:
      # Optional: the "Shortkeys Dev" certificate, so CI builds have the same
      # signature as local builds and the Accessibility permission survives
      # updates. See the README ("Signing CI builds"). Without it, builds are
      # signed ad-hoc.
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $VERSION ($GITHUB_RUN_NUMBER)"

      - name: Import signing certificate
        if: env.SIGNING_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Test window geometry
        run: scripts/test-geometry.sh

      - name: Build
        run: SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" ./build.sh

      - name: Check the signature
        run: |
          codesign --verify --strict build/Shortkeys.app
          if [ -n "$SIGNING_CERT_P12" ]; then
            # Releases must carry the "Shortkeys Dev" certificate, so updates keep
            # their Accessibility permission and pass the in-app updater's check.
            codesign -dr - build/Shortkeys.app 2>&1 | tee /dev/stderr | grep -q "certificate leaf"
          fi

      - name: Self-test (hotkey wiring + screenshots of every Settings page)
        env:
          GITHUB_TOKEN: ${{ github.token }} # the update check would hit the anonymous rate limit
        run: |
          # Hide the build folder: the app must work from its own bundle, as on
          # any other Mac (a release once found its resources only here).
          mv .build "$RUNNER_TEMP/swiftpm-build"
          SNAPS="$RUNNER_TEMP/snapshots"
          build/Shortkeys.app/Contents/MacOS/Shortkeys --snapshot "$SNAPS" &
          for i in $(seq 1 120); do [ -f "$SNAPS/selftest.txt" ] && break; sleep 1; done
          cat "$SNAPS/selftest.txt"
          ! grep -q FAIL "$SNAPS/selftest.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/snapshots/*.png
          if-no-files-found: ignore

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Shortkeys-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          Download \`Shortkeys-$VERSION.pkg\` and open it. Requires macOS 27.

          **"Apple could not verify…"**: the installer isn't notarized by Apple, so macOS blocks the first open. Click **Done**, then go to System Settings → Privacy & Security, click **Open Anyway** next to Shortkeys, and enter your password. Or install from Terminal:

          \`\`\`sh
          xattr -d com.apple.quarantine ~/Downloads/Shortkeys-$VERSION.pkg
          sudo installer -pkg ~/Downloads/Shortkeys-$VERSION.pkg -target /
          open /Applications/Shortkeys.app
          \`\`\`

          ## First launch

          1. Allow **Accessibility** access when asked. It's needed to detect hotkeys and to move windows.
          2. In Settings → General, turn on **Launch at Login**.
          NOTES
          sed -i '' 's/^          //' "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Shortkeys $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
